# Input config
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

input {
  kb_layout = us, ru
  kb_options = grp:win_space_toggle

  follow_mouse = 2

  sensitivity = 0

  touchpad {
    natural_scroll = true
  }
}

gesture = 3, horizontal, workspace

device {
  name = epic-mouse-v1
  sensitivity = -0.5
}
